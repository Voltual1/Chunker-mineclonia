name: Android CI (Converter Jar Only)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Gradle Cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ github.workspace }}/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/build.gradle.kts', '**/settings.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 临时剔除了 Decode Keystore 步骤，因为构建 Jar 通常不需要 Android 签名

      - name: Patch Java Source Code
        run: |
          echo "正在注释 System.exit..."
          find . -name "*.java" -exec sed -i -E 's/(System\.exit\s*\([^)]*\)\s*;?)/\/\/ \1/g' {} +

          FILE_1=$(find . -name "ChunkerBlockIdentifier.java" | head -n 1)
          if [ -n "$FILE_1" ]; then
              echo "正在修复: $FILE_1"
              sed -i -E 's/!builder\.isEmpty\(\)/builder.length() > 0/g' "$FILE_1"
              sed -i -E 's/builder\.isEmpty\(\)/builder.length() == 0/g' "$FILE_1"
          else
              echo "警告: 未找到 ChunkerBlockIdentifier.java (跳过)"
          fi

          FILE_2=$(find . -name "FontUtil.java" | head -n 1)
          if [ -n "$FILE_2" ]; then
              echo "正在修复: $FILE_2"
              sed -i -E 's/!currentLine\.isEmpty\(\)/currentLine.length() > 0/g' "$FILE_2"
              sed -i -E 's/currentLine\.isEmpty\(\)/currentLine.length() == 0/g' "$FILE_2"
              sed -i -E 's/!currentWord\.isEmpty\(\)/currentWord.length() > 0/g' "$FILE_2"
              sed -i -E 's/currentWord\.isEmpty\(\)/currentWord.length() == 0/g' "$FILE_2"
          else
              echo "警告: 未找到 FontUtil.java (跳过)"
          fi

      # 【修改点 1】仅编译并打包 converter 模块的 jar
      - name: Build Converter Jar
        run: ./gradlew :converter:jar

      - name: Get version info
        id: version
        shell: bash
        run: |
          echo "BUILD_VERSION=auto-build-$(date +%Y%m%d_%H%M%S)-${GITHUB_SHA:0:8}" >> $GITHUB_OUTPUT
          echo "TIMESTAMP=$(date +"%Y-%m-%d %H:%M:%S")" >> $GITHUB_OUTPUT

      # 【修改点 2】修改上传的文件路径为 converter 模块下的 jar 包
      - name: Create Draft Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.BUILD_VERSION }}
          name: "Converter Build ${{ steps.version.outputs.BUILD_VERSION }}"
          body: |
            ### 构建信息
            - 提交: `${{ github.sha }}`
            - 构建时间: `${{ steps.version.outputs.TIMESTAMP }}`

            **注意**: 此版本仅包含 `converter` 模块的 JAR 文件。
          draft: true
          files: |
            converter/build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save Gradle cache
        if: success()
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ github.workspace }}/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/build.gradle.kts', '**/settings.gradle.kts') }}